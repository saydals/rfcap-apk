<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RFCap - Rotorflight Configurator</title>
<script src="./hub.js?v=119"></script>
<style>
    :root { --hdr-h:30px; --nav-h:54px; }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html[data-theme="light"] {
        --bg:#e6e8ec; --surface:#f5f6f8; --text:#1a1c20; --soft:#5a6070;
        --border:#c9ccd4; --accent:hsl(202,100%,45%); --ok:#2e8b2e; --chip:#ffffff;
    }
    html[data-theme="dark"] {
        --bg:#121417; --surface:#1d2025; --text:#e8eaee; --soft:#9aa0ad;
        --border:#33373f; --accent:hsl(202,100%,55%); --ok:#5dcf5d; --chip:#24272d;
    }
    html,body { height:100%; overflow:hidden; }
    body {
        font-family:"Open Sans","Segoe UI",Tahoma,sans-serif; font-size:13px;
        background:var(--bg); color:var(--text);
        display:flex; flex-direction:column;
        padding-top:env(safe-area-inset-top);
    }
    /* ---------- common header ---------- */
    #app-header {
        height:var(--hdr-h); flex:0 0 auto;
        display:flex; align-items:center; gap:6px;
        padding:0 8px;
        background:var(--surface); border-bottom:1px solid var(--border);
        box-shadow:0 2px 6px rgba(0,0,0,.14);
        z-index:10;
    }
    @media (orientation: portrait) {
        #app-header { height:calc(var(--hdr-h) + env(safe-area-inset-top, 24px)); }
    }
    #app-logo { font-weight:bold; font-size:20px; line-height:1; letter-spacing:.3px; color:var(--accent); white-space:nowrap; }
    #conn-chip {
        display:flex; align-items:center; gap:6px;
        background:var(--chip); border:1px solid var(--border);
        border-radius:15px; padding:4px 10px; min-width:0;
    }
    #conn-dot { width:9px; height:9px; border-radius:50%; background:#999; flex:0 0 auto; transition:background .2s; }
    #conn-dot.on-spp, #conn-dot.on-ble { background:var(--ok); box-shadow:0 0 6px var(--ok); }
    #conn-text { font-size:13px; color:var(--soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46vw; }
    #exit-btn {
        margin-left:auto; background:transparent; border:none; cursor:pointer;
        padding:0; display:flex; align-items:center; justify-content:center;
    }
    #exit-btn img { width:20px; height:20px; display:block; }
    #theme-btn { background:transparent; border:none; font-size:20px; cursor:pointer; color:var(--text); padding:2px 6px; }
    /* ---------- tab area ---------- */
    #tab-area { flex:1 1 auto; position:relative; min-height:0; }
    /* All tabs stay mounted & sized (visibility toggle, NOT display:none)
       so canvases (three.js heli) survive tab switches. */
    #tab-area iframe {
        position:absolute; inset:0; width:100%; height:100%;
        border:none; background:var(--bg);
        /* keep every tab PAINTING (opacity, not display/visibility) so the
           three.js rAF loop never stalls and WebGL state is never lost */
        opacity:0; pointer-events:none;
    }
    #tab-area iframe.active { opacity:1; pointer-events:auto; z-index:2; }
    /* ---------- bottom nav ---------- */
    #tab-nav {
        height:calc(var(--nav-h) + env(safe-area-inset-bottom));
        flex:0 0 auto; display:flex;
        background:var(--surface); border-top:1px solid var(--border);
        padding-bottom:env(safe-area-inset-bottom);
    }
    .tab-btn {
        flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
        gap:3px; background:none; border:none; color:var(--soft);
        font-family:inherit; font-size:10px; cursor:pointer; user-select:none;
        padding-top:6px;
    }
    .tab-btn .ico {
        width:22px; height:22px; object-fit:contain; display:block;
        opacity:.55; transition:.15s;
        /* source SVGs are white - recolour per theme */
        filter:invert(.72) grayscale(1);
    }
    html[data-theme="dark"] .tab-btn .ico { opacity:.5; filter:none; }
    .tab-btn.active { color:var(--accent); }
    html[data-theme="light"] .tab-btn.active .ico { opacity:1; filter:invert(.78) sepia(1) saturate(28) hue-rotate(172deg) brightness(.9); transform:scale(1.08); }
    html[data-theme="dark"]  .tab-btn.active .ico { opacity:1; filter:none; transform:scale(1.08); }

    #header-save-btn {
        display: inline-block;
        margin-left: 4px;
        padding: 4px 12px;
        background-color: #2e7d32;
        color: #fff;
        border: 1px solid #1b5e20;
        border-radius: 4px;
        text-decoration: none;
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
        line-height: 1.2;
    }
    /* the status tab has nothing to save - shell.js hides the button there */
    #header-save-btn[data-hidden="1"] { display: none; }
    #header-save-btn:hover {
        background-color: #1b5e20;
    }

    @media (orientation: landscape) {
        /* Grid shell: the header spans the full top row, the tab nav becomes
           a fixed left rail, and the tab area fills the remaining cell.
           Unlike the old flex-wrap approach this can never break onto extra
           lines, so there is no dead space and no squeezed header. */
        body {
            display: grid;
            grid-template-columns: 76px 1fr;
            grid-template-rows: 48px 1fr;
            padding-top: 0;
        }
        #app-header {
            grid-column: 1 / 3; grid-row: 1;
            height: 48px; width: auto;
        }
        #tab-nav {
            grid-column: 1; grid-row: 2;
            flex-direction: column;
            height: auto;
            border-top: none;
            border-right: 1px solid var(--border);
            padding-bottom: 0;
            padding-right: env(safe-area-inset-right, 0px);
            padding-left: env(safe-area-inset-left, 0px);
        }
        #tab-area {
            grid-column: 2; grid-row: 2;
            min-width: 0; min-height: 0;
        }
        .tab-btn {
            flex-direction: column;
            justify-content: center;
            padding: 4px 6px;
            gap: 2px;
        }
        .tab-btn .ico {
            width: 20px;
            height: 20px;
        }
    }
    /* ---------- leave-confirmation dialog (dirty tab switch) ----------
       Unified with the tabs' own "Save changes?" dialogs: same title,
       wording and style, with EXPLICIT fixed centering so it stays in the
       middle of the screen even on WebViews whose UA modal positioning
       is unreliable (no more top-of-screen appearance). */
    #leave-dialog {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        margin: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
        padding: 14px 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,.4);
        min-width: 280px;
        max-width: 86vw;
        font-family: inherit;
        z-index: 20;
    }
    #leave-dialog::backdrop { background: rgba(0,0,0,.45); }
    #leave-dialog h3 { margin: 0 0 8px 0; font-size: 14px; }
    #leave-dialog .leave-msg { font-size: 12px; color: var(--soft); margin-bottom: 14px; }
    #leave-dialog .leave-row { display: flex; gap: 8px; justify-content: flex-end; }
    #leave-dialog button {
        padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
        background: var(--chip); color: var(--text);
        font-family: inherit; font-size: 12px; cursor: pointer;
    }
    #leave-dialog #leave-save { background: #2e7d32; border-color: #1b5e20; color: #fff; }
</style>
</head>
<body>
    <header id="app-header">
        <span id="app-logo">RFCap</span>
        <div id="conn-chip" title="Connection state (shared across all tabs)">
            <span id="conn-dot"></span>
            <span id="conn-text">Disconnected</span>
        </div>
        <a id="header-save-btn" href="#" title="Save the active tab (same as the tab's own Save button)">Save</a>
        <button id="exit-btn" title="Exit"><img src="./icons/exit.svg" alt="Exit"></button>
        <button id="theme-btn" title="Toggle theme">&#127769;</button>
    </header>

    <main id="tab-area">
        <iframe id="tab-status"   src="./tabs/status.html?v=120"   class="active" title="Status"></iframe>
        <iframe id="tab-mixer"    src="./tabs/mixer.html?v=120"    title="Mixer"></iframe>
        <iframe id="tab-servos"   src="./tabs/servos.html?v=119"   title="Servos"></iframe>
        <iframe id="tab-rates"    src="./tabs/Rates.html?v=122"    title="Rates"></iframe>
        <iframe id="tab-profiles" src="./tabs/Profiles.html?v=122" title="Profiles"></iframe>
    </main>

    <nav id="tab-nav">
        <button class="tab-btn active" data-tab="status"><img class="ico" src="./icons/cf_icon_data_white.svg" alt="">Status</button>
        <button class="tab-btn" data-tab="mixer"><img class="ico" src="./icons/cf_icon_mixer.svg" alt="">Mixer</button>
        <button class="tab-btn" data-tab="servos"><img class="ico" src="./icons/cf_icon_servo_white.svg" alt="">Servos</button>
        <button class="tab-btn" data-tab="rates"><img class="ico" src="./icons/cf_icon_pid_white.svg" alt="">Rates</button>
        <button class="tab-btn" data-tab="profiles"><img class="ico" src="./icons/cf_icon_settings_white.svg" alt="">Profiles</button>
    </nav>

    <dialog id="leave-dialog">
        <h3>Save changes?</h3>
        <p class="leave-msg">Do you want to save changes before leaving?</p>
        <div class="leave-row">
            <button type="button" id="leave-save">Yes, save &amp; move</button>
            <button type="button" id="leave-discard">No, discard &amp; move</button>
        </div>
    </dialog>

<script src="./shell.js?v=119"></script>
</body>
</html>
